<!doctype html>
<html
  lang="en"
  class="bg-slate-950 text-slate-200 font-sans"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>
      AniHaven - Discover, Review & Stream Your Favorite Anime | Free Anime
      Search
    </title>
    <meta
      name="description"
      content="Discover anime with AniHaven! Search thousands of anime titles, watch trailers, read reviews, and find streaming platforms. Your ultimate anime discovery tool."
    />
    <meta
      name="keywords"
      content="anime, anime search, anime reviews, anime streaming, anime trailers, manga, otaku, crunchyroll, anime discovery"
    />
    <meta name="author" content="CreeksonJoseph" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://creeksonjoseph.github.io/AniHaven/" />

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="AniHaven - Discover & Stream Your Favorite Anime"
    />
    <meta
      property="og:description"
      content="Search anime, watch trailers, read reviews, and find streaming platforms. Your ultimate anime discovery tool."
    />
    <meta
      property="og:image"
      content="https://creeksonjoseph.github.io/AniHaven/img/home.png"
    />
    <meta
      property="og:url"
      content="https://creeksonjoseph.github.io/AniHaven/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AniHaven" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AniHaven - Discover & Stream Your Favorite Anime"
    />
    <meta
      name="twitter:description"
      content="Search anime, watch trailers, read reviews, and find streaming platforms."
    />
    <meta
      name="twitter:image"
      content="https://creeksonjoseph.github.io/AniHaven/img/home.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎌</text></svg>"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/output.css" />
    <meta
      name="google-site-verification"
      content="xQAGfI5ZVoBLxtESXeCIWylX0W82SmQ3hAm0EvhMjCw"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AniHaven",
        "description": "Discover anime with AniHaven! Search thousands of anime titles, watch trailers, read reviews, and find streaming platforms.",
        "url": "https://creeksonjoseph.github.io/AniHaven/",
        "applicationCategory": "Entertainment",
        "operatingSystem": "Web Browser",
        "author": {
          "@type": "Person",
          "name": "CreeksonJoseph",
          "email": "charanajoseph@gmail.com"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body class="flex flex-col min-h-screen">
    <header
      class="fixed top-0 left-0 w-full flex flex-row justify-between items-center bg-slate-950/80 backdrop-blur-md shadow-lg py-4 border-b border-slate-800 z-50"
      role="banner"
    >
      <div class="ml-2">
        <h1 class="text-3xl font-bold font-heading text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500">
          AniHaven🎌
        </h1>
      </div>
      <p class="text-xs font-serif text-slate-400 pr-5">
        Your favourite<br />anime discovery tool
      </p>
    </header>
    <main class="container mx-auto px-4 py-10 pt-24 grow" role="main">
      <div class="flex flex-col items-center mb-4">
        <form
          id="anime-form"
          class="flex flex-col md:flex-row items-center gap-4 mb-4"
          role="search"
          aria-label="Search for anime"
        >
          <input
            type="text"
            id="search"
            placeholder="Search anime (e.g. Naruto, Bleach...)"
            class="w-full md:w-96 px-4 py-3 rounded-full focus:outline-none shadow-md bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
            aria-label="Enter anime name to search"
            autocomplete="off"
          />
        </form>

        <h2 id="sectionTitle" class="text-2xl font-semibold font-heading text-slate-100"></h2>
      </div>

      <section
        id="suggestedAnime"
        class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-4"
        aria-label="Anime results"
      ></section>

      <!-- Loading Spinner -->
      <div
        id="loadingSpinner"
        class="hidden flex justify-center items-center py-8"
      >
        <div
          class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500"
        ></div>
      </div>
    </main>
    <footer
      class="bg-slate-900 py-6 text-center text-sm text-slate-400 border-t border-slate-800"
      role="contentinfo"
    >
      Built by
      <a
        href="mailto:charanajoseph@gmail.com"
        class="text-indigo-400 hover:text-indigo-300 hover:underline"
        >CreeksonJoseph</a
      >
      💻 | Powered by
      <a
        href="https://anilist.co/"
        class="text-indigo-400 hover:text-indigo-300 hover:underline"
        target="_blank"
        rel="noopener"
        >AniList API</a
      >
    </footer>
    <script src="./src/script.js"></script>
  </body>
</html>
